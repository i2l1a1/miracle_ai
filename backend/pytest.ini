[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
testpaths = tests
markers =
    integration: requires PostgreSQL test database
    llm: real OpenRouter generation
filterwarnings =
    ignore::sqlalchemy.exc.MovedIn20Warning
    ignore:'crypt' is deprecated and slated for removal:DeprecationWarning:passlib.utils
    ignore:async generator function lifespans are deprecated:DeprecationWarning:starlette.routing
